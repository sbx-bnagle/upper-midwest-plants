<div class="query-pane" id="query-pane">
  <div class="query-pane-head">
    <span class="query-pane-title">Query</span>
    <button class="query-close" id="query-close" title="Close">&#10005;</button>
  </div>

  <div class="query-section">
    <div class="query-checkboxes">
      <label class="query-checkbox"
        ><input type="checkbox" id="f-lowmaint" /><span>Low Maintenance</span></label
      >
      <label class="query-checkbox"
        ><input type="checkbox" id="f-drought" /><span>Drought Resistant</span></label
      >
    </div>
  </div>

  <div class="query-section">
    <span class="query-label">Category</span>
    <div class="pills" id="pills-cat"></div>
  </div>

  <div class="query-section">
    <div class="field">
      <label>Nativity Tier</label
      ><select id="f-tier">
        <option value="">All tiers</option>
      </select>
    </div>
  </div>

  <div class="query-section">
    <span class="query-label">Garden Attributes</span>
    <div class="pills" id="pills-attr"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Bloom Months</span>
    <div class="month-selector" id="sel-bloom"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Fall Foliage</span>
    <div class="month-selector" id="sel-foliage"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Seedhead Interest</span>
    <div class="month-selector" id="sel-seedhead"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Bloom Color</span>
    <div class="pills" id="pills-color"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Growth Habit</span>
    <div class="pills" id="pills-habit"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Leaf</span>
    <div class="pills" id="pills-leaf"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Flower Shape</span>
    <div class="pills" id="pills-flower"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Light</span>
    <div class="pills" id="pills-light"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Water</span>
    <div class="pills" id="pills-water"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Soil</span>
    <div class="pills" id="pills-soil"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Height Range (ft)</span>
    <div class="dual-slider" id="ds-height"></div>
  </div>

  <div class="query-section">
    <span class="query-label">Spread Range (ft)</span>
    <div class="dual-slider" id="ds-spread"></div>
  </div>
</div>
